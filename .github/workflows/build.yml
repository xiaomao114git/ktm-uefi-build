name: Build ktm UEFI

# This repository exists only as a build host. GitHub Actions is disabled on the
# fork (xiaomao114git/Mu-Silicium) that carries the actual ktmPkg work, so the
# build runs here and pulls that fork as its source.
#
# Output: artifact ktm-uefi-images containing
#   Mu-ktm.img          the plain UEFI boot image (no payload)
#   Mu-ktm-payload.img  the same image with the K90 loader + kernel attached as an
#                       XNUP container, which is what BootShim copies to 0xF0000000

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SOURCE_REPO: xiaomao114git/Mu-Silicium
  SOURCE_REF: main
  DEVICE: ktm
  # Redmi K90 (annibale) is the same SM8750 as the OnePlus Ace 6 (ktm), and its port
  # already runs iOS with this exact loader/kernel pair.
  K90_PREBUILT: https://raw.githubusercontent.com/iola1999/hackios-xnu-kernel/k90-port/prebuilt

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the firmware source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          path: src

      - name: Show what will be built
        working-directory: src
        run: |
          echo "source: ${{ env.SOURCE_REPO }}@${{ env.SOURCE_REF }}"
          git log -1 --format='commit: %H %s'
          echo "--- package identity ---"
          grep -E 'PLATFORM_NAME|SOC_TYPE' Platforms/OnePlus/ktmPkg/ktm.dsc || true
          echo "--- memory layout (must match K90: FD 0x300000 at 0xA7100000) ---"
          grep -E '^base|^size|payload_base' Resources/Configs/ktm.toml || true
          grep -E 'UEFI_FD|XNU_Payload' Platforms/OnePlus/ktmPkg/Library/MemoryMapLib/MemoryMapLib.c || true

      - name: Install build dependencies
        working-directory: src
        env:
          CI_BUILD: true
        run: bash ./setup_env.sh -p apt

      - name: Build UEFI for ktm
        working-directory: src
        run: python3 build_uefi.py -d ${{ env.DEVICE }} -r DEBUG

      - name: Build the XNU loader for this device
        working-directory: src/Platforms/OnePlus/ktmPkg/xnuloader
        run: |
          chmod +x build.sh
          # identity.h here describes the iPhone iOS thinks it runs on, which is
          # common to every HakiOS port; it is not this phone's model.
          test -f identity.h || { echo "missing identity.h"; exit 1; }
          # And check the platform table carries this phone's real figures before
          # spending a build on it.
          echo "--- platform used for this device ---"
          sed -n '/platform_annibale = {/,/};/p' platform_private.h
          bash ./build.sh
          ls -la loader.efi

      - name: Fetch the K90 kernel
        working-directory: src
        run: |
          # Same SM8750, and this kernel is the one its port boots iOS with.
          curl -fsSL -o hakios-kernel "${{ env.K90_PREBUILT }}/mach.development.bcm2837"
          ls -la hakios-kernel
          echo "kernel sha256: $(sha256sum hakios-kernel | cut -d' ' -f1)"

      - name: Attach the payload to the boot image
        working-directory: src
        run: |
          # Minimal bring-up argument set: light the kernel up with one CPU and
          # verbose output, then add peripherals one at a time.
          #
          # Note what is deliberately absent: "cpus=". In this loader that argument
          # means "the kernel will manage several cores, list them in the device
          # tree", not "use only N". Passing cpus=1 therefore put seven CPU nodes in
          # the tree, and the kernel started the second one, waited 28 seconds for a
          # core that never answered, and aborted. Omitting it leaves a single CPU
          # node, which is what a first bring-up wants.
          #
          #   debug=0x09   the smallest mask that still gives a log: 0x01 DB_HALT keeps the
          #                kernel from rebooting on a panic so the loader gets it back, and
          #                0x08 DB_KPRT keeps the panic text. What is gone is 0x10f's 0x02
          #                DB_PRT, 0x04 DB_NMI and 0x100 - the debug-unit paths. The abort
          #                lands 33us after "pe_arm_init_debug: failed to find
          #                cpu-debug-interface", on a synchronous external abort (access to a
          #                device that does not answer), so this run asks whether enabling
          #                those paths is what makes the kernel touch one.
          #   cpus=1       one core, and (no bootcpu) the machine's first. This is the run that
          #                asks whether the hang belongs to the SMP path: the previous boot
          #                listed all eight cores, got past the abort that naming core_mpidr[1]
          #                used to cause, and then never came back to the loader - no panic
          #                text, no kernel log, nothing after "jumping to". A single core takes
          #                PSCI CPU_ON and the per-processor bring-up out of the picture.
          #   -v           verbose
          CMDLINE="debug=0x09 cpus=1 epoch=$(date +%s) -v"
          echo "cmdline: $CMDLINE"
          python3 Platforms/OnePlus/ktmPkg/xnuloader/attach_payload.py \
            Mu-ktm.img \
            Mu-ktm-payload.img \
            loader.efi=Platforms/OnePlus/ktmPkg/xnuloader/loader.efi \
            kernel=hakios-kernel \
            ramdisk=Platforms/OnePlus/ktmPkg/RawFiles/root.apfs \
            --cmdline "$CMDLINE" \
            --usb

      - name: List build output
        if: always()
        working-directory: src
        run: ls -la Mu-* 2>/dev/null || echo 'no Mu-* produced'

      - name: Upload UEFI images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktm-uefi-images
          path: src/Mu-*
          compression-level: 9
          if-no-files-found: warn
