name: Build ktm UEFI

# This repository exists only as a build host. GitHub Actions is disabled on the
# fork (xiaomao114git/Mu-Silicium) that carries the actual ktmPkg work, so the
# build runs here and pulls that fork as its source.
#
# Output: artifact ktm-uefi-images containing
#   Mu-ktm.img          the plain UEFI boot image (no payload)
#   Mu-ktm-payload.img  the same image with the XNU loader attached as an XNUP
#                       container, which is what BootShim copies to 0xF0000000

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SOURCE_REPO: xiaomao114git/Mu-Silicium
  SOURCE_REF: main
  DEVICE: ktm

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the firmware source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          path: src

      - name: Show what will be built
        working-directory: src
        run: |
          echo "source: ${{ env.SOURCE_REPO }}@${{ env.SOURCE_REF }}"
          git log -1 --format='commit: %H %s'
          echo "--- package identity ---"
          grep -E 'PLATFORM_NAME|SOC_TYPE' Platforms/OnePlus/ktmPkg/ktm.dsc || true
          echo "--- payload window ---"
          grep -E 'payload_base' Resources/Configs/ktm.toml || echo 'MISSING payload_base'
          echo "--- platforms the loader knows ---"
          grep -E 'struct platform platform_|PLAT = &platform' \
            Platforms/OnePlus/ktmPkg/xnuloader/loader.c || true

      - name: Install build dependencies
        working-directory: src
        env:
          CI_BUILD: true
        run: bash ./setup_env.sh -p apt

      - name: Build UEFI for ktm
        working-directory: src
        run: python3 build_uefi.py -d ${{ env.DEVICE }} -r DEBUG

      - name: Build the XNU loader
        working-directory: src/Platforms/OnePlus/ktmPkg/xnuloader
        run: |
          # Placeholder identity: this loader can start the open kernel only. A build
          # against an IPSW-derived identity is what makes Darwin boot.
          ./mkidentity.sh --placeholder
          ./build.sh
          ls -la loader.efi
          echo "--- platform selected at runtime ---"
          grep -n 'platform_ktm' loader.c | head -5

      - name: Attach the payload to the boot image
        working-directory: src
        run: |
          python3 Platforms/OnePlus/ktmPkg/xnuloader/attach_payload.py \
            Mu-ktm.img \
            Platforms/OnePlus/ktmPkg/xnuloader/loader.efi \
            Mu-ktm-payload.img

      - name: List build output
        if: always()
        working-directory: src
        run: ls -la Mu-* 2>/dev/null || echo 'no Mu-* produced'

      - name: Upload UEFI images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktm-uefi-images
          path: src/Mu-*
          compression-level: 9
          if-no-files-found: warn
